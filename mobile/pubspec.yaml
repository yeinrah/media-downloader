name: yt_downloader
description: YouTube / Vimeo MP3 Downloader
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP 요청
  http: ^1.2.0
  # 파일 저장 경로
  path_provider: ^2.1.2
  # 외부 앱에서 파일 열기
  open_filex: ^4.3.4
  # 권한 요청 (저장소)
  permission_handler: ^11.3.0
  # UUID (다운로드 항목 ID)
  uuid: ^4.3.3
  # URL 유효성 검사
  validators: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.svg
